name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out with full history
        uses: actions/checkout@v7.0.1
        with:
          # verify_claims.py inspects the whole history for the publication
          # boundary and the single-identity guarantee, so a shallow clone
          # would silently weaken those checks.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true
          cache-suffix: "python-${{ matrix.python-version }}"

      - name: Fresh dependency install from the lockfile
        run: uv sync --frozen --python ${{ matrix.python-version }}

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Import smoke test
        # No package boundary is declared (tool.uv.package = false); these are
        # the modules the notebooks and the Space import, so import them the
        # same way and confirm the shared prompt contract is intact.
        run: |
          uv run python -c "
          import sys
          sys.path[:0] = ['src', 'space']
          import chartqa_data, relaxed_accuracy, runtime
          assert chartqa_data.DATASET_ID == 'HuggingFaceM4/ChartQA'
          assert chartqa_data.ANSWER_INSTRUCTION.startswith('Answer the question')
          assert relaxed_accuracy.relaxed_correctness('96', '96')
          assert runtime.Settings is not None
          print('imports ok')
          "

      - name: Unit tests
        run: uv run python -m unittest discover -s tests -v

      - name: Verify README claims against evidence
        run: uv run python scripts/verify_claims.py

      - name: Secret scan (working tree and full history)
        run: uv run python .github/scripts/scan_secrets.py

      - name: Dataset and private-artifact boundary
        run: uv run python .github/scripts/check_boundary.py
